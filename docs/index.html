<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEB Job Acceptor: consulting case study</title>
<meta name="description" content="A 15-slide consulting-style case study of TEB Job Acceptor: context, method and problems solved in automating first-come job acceptance.">
<meta property="og:title" content="TEB Job Acceptor: consulting case study">
<meta property="og:description" content="Context, method and problems solved: automating first-come job acceptance around the clock.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://thatimabe.github.io/teb-job-acceptor/slides/01.jpg">
<style>
:root{--navy:#0A2540;--ink:#F6F7F4;--soft:#B9C6D3;--teal:#4FD1C5;--line:#2F4A66}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0}
header h1 span{color:var(--soft);font-weight:400}
nav{display:flex;gap:16px;flex-wrap:wrap}
a{color:var(--teal)}
a:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.stage{width:100%;max-width:1200px;aspect-ratio:16/9;background:#06182b;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.bar{width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;gap:16px}
button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 18px;cursor:pointer;min-width:96px}
button:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
button:disabled{opacity:.4;cursor:default}
.count{color:var(--soft);font-variant-numeric:tabular-nums;text-align:center;flex:1}
.progress{width:100%;max-width:1200px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.hint{color:var(--soft);font-size:14px;margin:0}
noscript{max-width:900px;padding:24px}
footer{padding:16px 24px;border-top:1px solid var(--line);color:var(--soft);font-size:14px}
@media (max-width:600px){header{padding:12px 16px}main{padding:16px}button{min-width:72px;padding:10px 12px}}
</style>
</head>
<body>
<header>
  <h1>TEB Job Acceptor <span>· consulting case study</span></h1>
  <nav>
    <a href="TEB-Job-Acceptor-Consulting-Case-Study.pdf">Download the PDF</a>
    <a href="https://github.com/ThatiMabe/teb-job-acceptor">View the code</a>
    <a href="https://github.com/ThatiMabe/teb-job-acceptor#readme">Read the README</a>
  </nav>
</header>
<main>
  <div class="stage"><img id="slide" src="slides/01.jpg" alt="Slide 1 of 15"></div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="bar">
    <button id="prev" type="button" aria-label="Previous slide">&larr; Back</button>
    <div class="count" id="count" aria-live="polite">1 / 15</div>
    <button id="next" type="button" aria-label="Next slide">Next &rarr;</button>
  </div>
  <p class="hint">Use the arrow keys, swipe, or the buttons. Press F for full screen.</p>
  <noscript>
    <p>This is a 15-slide case study. Turn on JavaScript to page through it here, or <a href="TEB-Job-Acceptor-Consulting-Case-Study.pdf">download the PDF</a>.</p>
  </noscript>
</main>
<footer>Context, method and problems solved. Code and documentation are MIT licensed.</footer>
<script>
(function () {
  var ALT = [
    "Cover: TEB Job Acceptor, automating first-come job acceptance around the clock",
    "Executive summary: a local agent watches two job portals every 30 to 60 seconds and accepts eligible work by fixed rules",
    "Context: two online portals, each job must be accepted quickly",
    "The problem: doing this by hand lost work because speed, hours and attention do not scale",
    "Approach: six requirements for a good solution",
    "Options considered: a normal Chrome window with an extension got past the bot protection",
    "The solution: a Chrome extension acts inside the portals while a local agent decides, records and alerts",
    "Method: every check follows the same five steps",
    "Safety by design: hard-coded guardrails limit every click",
    "How it was built: five days from first alert to live accepts",
    "Problems solved: each failure became a permanent fix backed by a test",
    "Results: the first live accepts worked and testing covers the safety rules",
    "Limits and risks: four limits remain, each with a mitigation",
    "Next steps: five steps to make the agent sturdier",
    "Appendix: the tech stack and the GitHub repository"
  ];
  var N = ALT.length, i = 0;
  var img = document.getElementById("slide"), count = document.getElementById("count"), bar = document.getElementById("bar");
  var prev = document.getElementById("prev"), next = document.getElementById("next");
  function src(n) { return "slides/" + (n < 9 ? "0" : "") + (n + 1) + ".jpg"; }
  function show(n) {
    i = Math.max(0, Math.min(N - 1, n));
    img.src = src(i);
    img.alt = "Slide " + (i + 1) + " of " + N + ". " + ALT[i];
    count.textContent = (i + 1) + " / " + N;
    bar.style.width = ((i + 1) / N * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === N - 1;
    if (i + 1 < N) { new Image().src = src(i + 1); }
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  prev.addEventListener("click", function () { show(i - 1); });
  next.addEventListener("click", function () { show(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(i + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
    else if (e.key === "Home") { show(0); }
    else if (e.key === "End") { show(N - 1); }
    else if (e.key === "f" || e.key === "F") {
      var el = document.querySelector(".stage");
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (el.requestFullscreen) { el.requestFullscreen(); }
    }
  });
  var x0 = null;
  img.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  img.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { show(i + (dx < 0 ? 1 : -1)); }
  });
  var start = parseInt((location.hash || "").replace("#", ""), 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
